name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 单元测试（纯函数层，不依赖禅道）
        run: pytest tests/unit -v

  golden:
    runs-on: ubuntu-latest
    needs: unit
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 集成冒烟（需要禅道容器，CI 里暂以单测为准）
        run: echo "禅道 docker 化 CI 待 week4（需在 CI 内起 zentao 容器 + 自动安装向导）"
